# Local full-stack parity for the API: gunicorn + a Postgres database.
#   docker compose up --build      → API on http://localhost:8000 (real Postgres)
# Then run the SPA against it:
#   cd frontend && npm install && npm run dev   → http://localhost:5173
# Log in with the seeded demo users (password: demo12345).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fixflow
      POSTGRES_PASSWORD: fixflow
      POSTGRES_DB: fixflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixflow"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      SECRET_KEY: local-compose-not-secret
      DEBUG: "false"
      DEMO_MODE: "true"
      DATABASE_URL: postgres://fixflow:fixflow@db:5432/fixflow
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:8000
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      SECURE_SSL_REDIRECT: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
